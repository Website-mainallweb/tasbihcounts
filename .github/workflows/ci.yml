name: check

# The real gate. A pre-push hook is a convenience and can be skipped with
# --no-verify; this cannot. Hostinger builds from `main`, so a red run here is
# the warning that the next deploy is broken.
on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # check-secrets scans git's tracked files, which needs the repo, not a
          # sparse checkout. Depth 1 is enough — it reads the working tree.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # Match Hostinger's Node so a version-only failure shows up here first.
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # ci, never install: the lockfile is the contract, and a resolution that
      # differs from the developer's machine is the bug this catches.
      - run: npm ci

      - name: typecheck, lint, unit tests, secret scan, audit, production build
        run: npm run check

      - name: install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: end-to-end on the production build
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
